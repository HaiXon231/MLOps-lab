apiVersion: apps/v1
kind: Deployment

metadata:
  name: iris-api
  namespace: mlops-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: iris-api

  template:
    metadata:
      labels:
        app: iris-api

    spec:
      containers:
        - name: iris-api

          image: iris-api
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: iris-api-config

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 15
            periodSeconds: 10

---

apiVersion: v1
kind: Service

metadata:
  name: iris-api
  namespace: mlops-demo

spec:
  selector:
    app: iris-api

  ports:
    - port: 8000
      targetPort: 8000

  type: ClusterIP