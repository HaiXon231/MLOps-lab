name: MLOps Pipeline

permissions:
  contents: read

concurrency:
  group: mlops-pipeline-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
      
    paths-ignore:
      - "k8s/**"
      - "*.md"
      - "docs/**"

  pull_request:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Validate Python syntax
        run: |
          python -m compileall src

  build:
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          tags: |
            ghcr.io/haixon231/iris-api:${{ github.sha }}
            ghcr.io/haixon231/iris-api:latest

      - name: Update Kubernetes image tag
        run: |
          sed -i \
            "s|^    newTag:.*$|    newTag: ${GITHUB_SHA}|" \
            k8s/kustomization.yaml

          grep "newTag:" k8s/kustomization.yaml

      - name: Commit deployment manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/kustomization.yaml

          if git diff --cached --quiet; then
            echo "Kubernetes image tag is already up to date"
            exit 0
          fi

          git commit -m "chore: deploy ${GITHUB_SHA} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
