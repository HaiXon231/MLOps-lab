apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: mlops-cloud-lab
  region: ap-southeast-1

vpc:
  nat:
    gateway: Disable

managedNodeGroups:
  - name: workers
    instanceType: t3.large

    desiredCapacity: 1
    minSize: 1
    maxSize: 1

    volumeSize: 20
    privateNetworking: false

    ssh:
      allow: false