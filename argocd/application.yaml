apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: mlops-demo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/HaiXon231/MLOps-lab.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: mlops-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true