services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.5.0

    command:
      - mlflow
      - server 
      - --backend-store-uri
      - sqlite:///mlflow-data/mlflow.db
      - --default-artifact-root
      - /mlflow-data/mlartifacts
      - --host 
      - 0.0.0.0
      - --port
      - "5000"

    ports:
      - "5000:5000"

    volumes:
      - ./docker-mlflow-data:/mlflow-data

  api:
    build: 
      context: .

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

    ports:
      - "8000:8000"

    depends_on:
      - mlflow