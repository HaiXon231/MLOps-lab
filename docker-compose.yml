services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1

    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow-data/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow-data/mlartifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000

    ports:
      - "5000:5000"

    volumes:
      - ./docker-mlflow-data:/mlflow-data

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .

    image: iris-api:1.0

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/iris-classifier@champion

    ports:
      - "8000:8000"

    depends_on:
      mlflow:
        condition: service_healthy
